<svg viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
    </filter>
  </defs>

  <!-- glowing banner behind the badge -->
  <rect x="4" y="4" width="120" height="120" rx="32" fill="url(#bg)" filter="url(#glow)" opacity="0.85"/>

  <!-- main squircle badge -->
  <rect x="6" y="6" width="116" height="116" rx="30" fill="url(#bg)"/>
  <rect x="7" y="7" width="114" height="114" rx="29" fill="none" stroke="rgba(255,255,255,0.28)" stroke-width="2"/>

  <!-- vertical-clip frame glyph -->
  <rect x="46" y="30" width="36" height="68" rx="12" fill="none" stroke="#ffffff" stroke-width="6"/>
  <path d="M56,48 L56,80 L77,64 Z" fill="#ffffff"/>
</svg>
